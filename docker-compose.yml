services:
  product-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
      POSTGRES_DB: productdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d productdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - product_db_data:/var/lib/postgresql/data
    networks: [fastshop]

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orderdb
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orderdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks: [fastshop]

  product-service:
    build:
      context: ./product-service
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://product:product@product-db:5432/productdb
    depends_on:
      product-db:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks: [fastshop]

  order-service:
    build:
      context: ./order-service
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://orders:orders@order-db:5432/orderdb
    depends_on:
      order-db:
        condition: service_healthy
    ports:
      - "3002:3002"
    networks: [fastshop]

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      PORT: 3000
      PRODUCT_SERVICE_URL: http://product-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
    depends_on:
      - product-service
      - order-service
    ports:
      - "3000:3000"
    networks: [fastshop]

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api-gateway
    ports:
      - "8080:80"
    networks: [fastshop]

networks:
  fastshop:

volumes:
  product_db_data:
  order_db_data: